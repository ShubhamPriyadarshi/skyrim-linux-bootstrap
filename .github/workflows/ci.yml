name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: bash -n bin/skyrim-linux-bootstrap install.sh tests/test.sh
      - name: Check Python syntax
        run: python3 -m py_compile lib/patch_ini.py
      - name: Run ShellCheck
        run: shellcheck bin/skyrim-linux-bootstrap install.sh tests/test.sh
      - name: Run tests
        run: bash tests/test.sh

  release-archive:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build portable archive
        run: |
          mkdir -p dist
          tar --exclude-vcs --exclude=dist -czf "dist/skyrim-linux-bootstrap-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

